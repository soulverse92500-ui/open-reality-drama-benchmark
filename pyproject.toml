[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-reality-drama-benchmark"
version = "0.1.0"
description = "Offline continuity benchmark for structured AI drama output"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ORDB contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
ordb = "ordb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
